<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Indramayu Club Launcher v2</title>
<link href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@300;400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* RESET & BASE SYSTEM */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  
  body {
    font-family: 'Product Sans', 'Inter', sans-serif;
    width: 100vw;
    height: 100vh;
    max-width: 390px;
    max-height: 844px;
    margin: 0 auto;
    background: #000;
    overflow: hidden;
    position: relative;
    color: #fff;
  }

  /* PREMIUM WALLPAPER GRADIENT */
  .wallpaper {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 10% 10%, rgba(32, 40, 25, 0.9) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(20, 24, 45, 0.95) 0%, transparent 65%),
                linear-gradient(155deg, #090B0E 0%, #11141A 50%, #07080B 100%);
    z-index: 0;
  }

  body > * { position: relative; z-index: 1; }

  /* ANDROID STATUS BAR RE-DESIGN */
  .statusbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 24px 4px;
    font-size: 13px; font-weight: 500; letter-spacing: 0.3px;
    color: rgba(255, 255, 255, 0.95);
  }
  .sb-icons { display: flex; gap: 8px; align-items: center; }
  .sb-icon { width: 16px; height: 16px; fill: currentColor; }

  /* MATERIAL YOU CLOCK & DATE WIDGET */
  .android-widget {
    padding: 32px 24px 16px;
    text-align: left;
  }
  .clock-time {
    font-size: 64px; font-weight: 300; color: #E3E2E6; 
    line-height: 1; letter-spacing: -1px;
  }
  .clock-date {
    font-size: 16px; font-weight: 400; color: #C7C6CA;
    margin-top: 8px; margin-left: 4px;
  }

  /* ACTIVE GOOGLE WIDGET (BYPASS SENSOR) */
  .search-wrapper { margin: 12px 18px; }
  .search-bar {
    background: rgba(239, 230, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 28px; padding: 12px 18px;
    display: flex; align-items: center; gap: 12px;
    backdrop-filter: blur(20px); box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  }
  .search-g { font-size: 18px; font-weight: 700; background: linear-gradient(135deg,#4285F4,#EA4335,#FBBC05,#34A853); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .search-bar input {
    background: none; border: none; color: #fff; flex: 1; 
    outline: none; font-size: 14px; font-family: 'Product Sans', sans-serif;
  }
  .search-bar input::placeholder { color: rgba(255,255,255,0.45); }

  /* SCROLLABLE APPS DRAWER CONTAINER */
  .scroll-area {
    height: calc(100vh - 280px);
    max-height: 510px;
    overflow-y: auto;
    padding: 10px 14px 120px;
    scrollbar-width: none;
  }
  .scroll-area::-webkit-scrollbar { display: none; }

  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    color: rgba(201, 168, 76, 0.85); text-transform: uppercase;
    padding: 12px 12px 6px; font-family: 'Product Sans', sans-serif;
  }

  /* ANDROID STYLE 4-COLUMN GRID */
  .app-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 20px 6px; padding: 6px 0 16px;
  }

  .app-item {
    display: flex; flex-direction: column; align-items: center; 
    text-align: center; cursor: pointer; position: relative;
  }

  /* MATERIAL YOU SQUIRCLE ICON DESIGN */
  .app-icon {
    width: 58px; height: 58px; border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    position: relative;
  }
  .app-item:active .app-icon { transform: scale(0.88); }
  .app-icon svg, .app-icon span { width: 30px; height: 30px; font-size: 28px; display: flex; align-items: center; justify-content: center; }

  .app-name {
    font-size: 11px; color: #E3E2E6; margin-top: 8px;
    font-weight: 400; max-width: 72px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* NOTIFICATION BADGE */
  .badge {
    position: absolute; top: -2px; right: -2px;
    background: #E84393; color: #fff; font-size: 10px; font-weight: 700;
    min-width: 18px; height: 18px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 4px; border: 2px solid #11141A; z-index: 5;
  }

  /* REAL ANDROID FOLDER BOX */
  .folder-box {
    width: 58px; height: 58px; border-radius: 18px;
    background: rgba(255, 255, 255, 0.08); 
    border: 1px solid rgba(255, 255, 255, 0.12);
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
    gap: 4px; padding: 8px; transition: transform 0.1s;
  }
  .folder-mini { 
    border-radius: 6px; display: flex; align-items: center; 
    justify-content: center; font-size: 12px; background: rgba(0,0,0,0.2);
  }

  /* COLOR PALETTE MATERIAL DESIGN */
  .ic-fb      { background: #1877F2; }
  .ic-wa      { background: #25D366; }
  .ic-tt      { background: #000000; border: 1px solid rgba(255,255,255,0.2); }
  .ic-gdrive  { background: #FFFFFF; }
  .ic-chess   { background: #769656; }
  .ic-game    { background: linear-gradient(135deg, #FF6B35, #FF8E53); }
  .ic-coc     { background: #1A2B6D; }
  .ic-android { background: #3DDC84; }
  .ic-claude  { background: #FBF0DF; color: #191816; }
  .ic-indclub { background: linear-gradient(135deg, #0F2015, #16331F); border: 1.5px solid #C9A84C; }
  .ic-grey    { background: rgba(255,255,255,0.06); }

  /* ANDROID BOTTOM NAVIGATION DOCK */
  .dock-container {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.95) 70%, transparent);
    padding-bottom: 8px; z-index: 10;
  }
  .dock-bar {
    margin: 0 16px 12px;
    background: rgba(30, 35, 45, 0.75); backdrop-filter: blur(30px);
    border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 32px;
    padding: 12px 10px;
    display: flex; justify-content: space-around; align-items: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .dock-icon {
    width: 52px; height: 52px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.1s;
  }
  .dock-item:active .dock-icon { transform: scale(0.88); }

  /* ANDROID NAVIGATION BAR INDICATOR */
  .home-indicator { display: flex; justify-content: center; padding: 4px 0 8px; }
  .home-bar { width: 96px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.5); }

  /* POPUP WINDOW OVERLAY */
  .popup-overlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.65);
    z-index: 500; backdrop-filter:blur(12px);
    align-items:center; justify-content:center;
  }
  .popup-overlay.show { display:flex; }
  .popup-box {
    width:350px; background:#1C1B1F; border-radius:28px;
    border:1px solid rgba(255,255,255,0.12); overflow:hidden;
    box-shadow: 0 24px 48px rgba(0,0,0,0.7);
  }
  .popup-header {
    padding:16px 20px; background: rgba(255,255,255,0.02);
    border-bottom:1px solid rgba(255,255,255,0.08);
    display:flex; align-items:center; gap:12px;
  }
  .popup-title { font-size:15px; font-weight:700; color:#E3E2E6; }
  .popup-url { font-size:11px; color:#93909A; margin-top:2px; }
  .popup-close { margin-left:auto; width:32px; height:32px; border-radius:50%; background:rgba(255,255,255,0.08); border:none; color:#fff; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .popup-iframe { width:100%; height:390px; border:none; background:#000; }
  
  .popup-actions { display:flex; gap:10px; padding:16px; background: rgba(255,255,255,0.02); }
  .popup-btn {
    flex:1; padding:12px; border-radius:20px; border:none;
    font-size: 13px; font-weight: 700; cursor:pointer; letter-spacing: 0.2px;
  }
  .popup-btn.open { background: #C9A84C; color:#1C1B1F; }
  .popup-btn.cancel { background: rgba(255,255,255,0.08); color: #C7C6CA; }

  /* BINGKAI EMULASI FRAME */
  .phone-frame {
    position:fixed; top:0; left:50%; transform:translateX(-50%);
    width:390px; height:844px; border-radius:44px;
    border:8px solid #16161A; pointer-events:none; z-index:999;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.1);
  }
</style>
</head>

    <iframe class="popup-iframe" id="p-frame" src="about:blank" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
    <div class="popup-actions">
      <button class="popup-btn open" id="p-open" onclick="openExternal()">🔗 Buka Akses Browser</button>
      <button class="popup-btn cancel" onclick="closePopup()">Kembali</button>
    </div>
  </div>
</div>

<script>
  // Pembaruan Jam & Tanggal Sistem Android 
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const t = h + ':' + m;
    document.getElementById('clock-time').textContent = t;
    document.getElementById('sb-time').textContent = t;
    
    const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
    const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    document.getElementById('clock-date').textContent = days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
  }
  updateClock(); setInterval(updateClock, 5000);

  // Daftar Lookup Aman Anti-Macet (Bypass Proteksi Iframe)
  const lookupBypassProteksi = {
    "web.whatsapp.com": "https://play.google.com/store/apps/details?id=com.whatsapp",
    "m.facebook.com": "https://m.facebook.com/",
    "claude.ai": "https://claude.ai/"
  };

  let currentUrl = '';
  function openApp(name, url, icon) {
    currentUrl = url;
    let domainCheck = url.replace('https://','').replace('http://','').split('/')[0];
    
    // Alihkan langsung jika aplikasi menolak Iframe
    if (lookupBypassProteksi[domainCheck]) {
      window.open(lookupBypassProteksi[domainCheck], '_blank');
      return;
    }

    document.getElementById('p-icon').textContent = icon;
    document.getElementById('p-title').textContent = name;
    document.getElementById('p-url').textContent = domainCheck;
    document.getElementById('p-frame').src = url;
    document.getElementById('popup').classList.add('show');
  }

  function closePopup() {
    document.getElementById('popup').classList.remove('show');
    document.getElementById('p-frame').src = 'about:blank';
  }

  function openExternal() {
    window.open(currentUrl, '_blank');
    closePopup();
  }

  // Google Search Engine Bypass Logic
  function handleSearch(event) {
    if (event.key === 'Enter') { executeSearch(); }
  }

  function executeSearch() {
    const query = document.getElementById('android-search-input').value;
    if (query.trim() !== "") {
      window.open("https://www.google.com/search?q=" + encodeURIComponent(query), '_blank');
    }
  }

  // Haptic Feedback Simulation (Animasi Ketukan Lembut Android)
  document.querySelectorAll('.app-item, .dock-item').forEach(el => {
    el.addEventListener('click', function() {
      const icon = this.querySelector('.app-icon, .folder-box, .dock-icon');
      if(icon) {
        icon.style.transform = 'scale(0.86)';
        setTimeout(() => icon.style.transform = '', 120);
      }
    });
  });
</script>
</body>
</html>
