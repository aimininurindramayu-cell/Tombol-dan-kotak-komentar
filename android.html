<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Android Home Screen v2</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }

  body {
    font-family: 'Inter', sans-serif;
    width: 390px;
    height: 844px;
    margin: 0 auto;
    background: #0A0A0A;
    overflow: hidden;
    position: relative;
  }

  .wallpaper {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 20% 20%, rgba(30,15,60,0.95) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(10,30,20,0.9) 0%, transparent 60%),
      linear-gradient(160deg, #0D0820 0%, #050D10 40%, #0A1205 100%);
  }
  .wallpaper::before {
    content:''; position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(45deg, rgba(201,168,76,0.025) 0, rgba(201,168,76,0.025) 1px, transparent 1px, transparent 18px),
      repeating-linear-gradient(-45deg, rgba(201,168,76,0.025) 0, rgba(201,168,76,0.025) 1px, transparent 1px, transparent 18px);
  }
  body > * { position: relative; z-index: 1; }

  /* STATUS BAR */
  .statusbar {
    display:flex; justify-content:space-between; align-items:center;
    padding: 12px 22px 6px;
    font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.85);
  }
  .sb-time { font-size: 15px; }
  .sb-icons { display:flex; gap:5px; align-items:center; font-size:11px; }

  /* CLOCK */
  .clock-widget { text-align:center; padding: 20px 0 8px; }
  .clock-time { font-size: 54px; font-weight:200; color:#fff; letter-spacing:-2px; line-height:1; text-shadow: 0 0 40px rgba(201,168,76,0.3); }
  .clock-date { font-size:13px; color:rgba(255,255,255,0.6); margin-top:4px; }

  /* SEARCH */
  .search-bar {
    margin: 10px 20px 6px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 28px; padding: 10px 18px;
    display:flex; align-items:center; gap:10px; backdrop-filter:blur(10px);
  }
  .search-g { font-size:16px; font-weight:700; background:linear-gradient(135deg,#4285F4,#EA4335,#FBBC05,#34A853); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .search-text { font-size:13px; color:rgba(255,255,255,0.5); flex:1; }

  /* SCROLL AREA */
  .scroll-area {
    height: 580px;
    overflow-y: auto;
    overflow-x: hidden;
    padding-bottom: 10px;
    scrollbar-width: none;
  }
  .scroll-area::-webkit-scrollbar { display:none; }

  /* SECTION LABEL */
  .section-label {
    font-size: 10px; font-weight:600; letter-spacing:0.12em;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    padding: 10px 20px 6px;
  }

  /* APP GRID */
  .app-grid {
    display:grid; grid-template-columns: repeat(4,1fr);
    gap: 16px 8px; padding: 4px 16px 12px;
  }

  .app-item {
    display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer;
  }
  .app-item:active .app-icon { transform:scale(0.85); }

  .app-icon {
    width: 56px; height: 56px; border-radius: 16px;
    display:flex; align-items:center; justify-content:center;
    transition:transform 0.12s; position:relative; overflow:visible;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  .app-icon img { width:100%; height:100%; object-fit:cover; border-radius:16px; }
  .app-icon svg { width:32px; height:32px; }

  .app-name {
    font-size:10px; color:rgba(255,255,255,0.85);
    text-align:center; text-shadow:0 1px 4px rgba(0,0,0,0.8);
    font-weight:400; line-height:1.3; max-width:64px;
    white-space: nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .badge {
    position:absolute; top:-4px; right:-4px;
    background:#FF3B30; color:#fff; font-size:9px; font-weight:700;
    min-width:16px; height:16px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    padding: 0 3px; border:1.5px solid #0A0A0A; z-index:2;
  }

  /* FOLDER */
  .folder-box {
    width:56px; height:56px; border-radius:16px;
    background:rgba(255,255,255,0.12); backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.2);
    display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr;
    gap:2px; padding:6px; transition:transform 0.12s;
    box-shadow:0 4px 16px rgba(0,0,0,0.3);
  }
  .app-item:active .folder-box { transform:scale(0.85); }
  .folder-mini { border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:11px; }

  /* ICON BACKGROUNDS */
  .ic-fb   { background: linear-gradient(145deg,#1877F2,#0C5DC7); }
  .ic-wa   { background: linear-gradient(145deg,#25D366,#128C7E); }
  .ic-tt   { background: #010101; border:0.5px solid rgba(255,255,255,0.15); }
  .ic-gdrive { background: linear-gradient(145deg,#fff,#f0f0f0); }
  .ic-chess  { background: linear-gradient(145deg,#769656,#4a6741); }
  .ic-game   { background: linear-gradient(145deg,#FF6B35,#E84393); }
  .ic-coc    { background: linear-gradient(145deg,#1A2B6D,#5B3FA0); }
  .ic-android{ background: linear-gradient(145deg,#3DDC84,#1ea85e); }
  .ic-claude { background: linear-gradient(145deg,#D97757,#b85c3a); }
  .ic-indclub{ background: linear-gradient(145deg,#0D1A12,#1C3D20); border:1px solid rgba(201,168,76,0.5); }
  .ic-grey   { background: rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1); }

  /* DIVIDER */
  .page-dots { display:flex; justify-content:center; gap:5px; padding:6px 0; }
  .dot { width:5px; height:5px; border-radius:3px; background:rgba(255,255,255,0.3); }
  .dot.active { width:16px; background:rgba(255,255,255,0.8); }

  /* DOCK */
  .dock { position:absolute; bottom:0; left:0; right:0; }
  .dock-bar {
    margin: 0 16px 24px;
    background: rgba(255,255,255,0.1); backdrop-filter:blur(30px);
    border:1px solid rgba(255,255,255,0.15); border-radius:28px;
    padding: 10px 18px;
    display:flex; justify-content:space-around; align-items:center;
    box-shadow: 0 4px 30px rgba(0,0,0,0.4);
  }
  .dock-item { display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; }
  .dock-item:active .dock-icon { transform:scale(0.85); }
  .dock-icon {
    width:48px; height:48px; border-radius:14px;
    display:flex; align-items:center; justify-content:center; transition:transform 0.12s;
  }
  .home-indicator { display:flex; justify-content:center; padding-bottom:6px; }
  .home-bar { width:110px; height:4px; border-radius:2px; background:rgba(255,255,255,0.3); }

  /* PHONE FRAME */
  .phone-frame {
    position:fixed; top:0; left:50%; transform:translateX(-50%);
    width:390px; height:844px; border-radius:44px;
    border:8px solid #1a1a1a;
    box-shadow: 0 0 0 1px #333, 0 30px 80px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(255,255,255,0.05);
    pointer-events:none; z-index:999;
  }
  .phone-frame::before {
    content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:120px; height:30px; background:#1a1a1a; border-radius:0 0 18px 18px;
  }

  /* POPUP OVERLAY */
  .popup-overlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7);
    z-index:500; backdrop-filter:blur(4px);
    align-items:center; justify-content:center;
  }
  .popup-overlay.show { display:flex; }
  .popup-box {
    width:340px; background:#1a1a1a; border-radius:20px;
    border:1px solid rgba(255,255,255,0.15); overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.8);
  }
  .popup-header {
    padding:14px 18px 12px;
    background:rgba(255,255,255,0.05);
    border-bottom:1px solid rgba(255,255,255,0.08);
    display:flex; align-items:center; gap:10px;
  }
  .popup-icon { font-size:22px; }
  .popup-title { font-size:14px; font-weight:600; color:#fff; }
  .popup-url { font-size:10px; color:rgba(255,255,255,0.4); margin-top:2px; }
  .popup-close { margin-left:auto; width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,0.1); border:none; color:#fff; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .popup-iframe { width:100%; height:380px; border:none; background:#000; }
  .popup-actions { display:flex; gap:8px; padding:12px; }
  .popup-btn {
    flex:1; padding:10px; border-radius:12px; border:none;
    font-size:12px; font-weight:600; cursor:pointer; letter-spacing:0.03em;
  }
  .popup-btn.open { background:linear-gradient(135deg,#C9A84C,#E8C97A); color:#0A0A0A; }
  .popup-btn.cancel { background:rgba(255,255,255,0.1); color:rgba(255,255,255,0.7); }
</style>
</head>

    <iframe class="popup-iframe" id="p-frame" src="about:blank" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
    <div class="popup-actions">
      <button class="popup-btn open" id="p-open" onclick="openExternal()">🔗 Buka di Browser</button>
      <button class="popup-btn cancel" onclick="closePopup()">Tutup</button>
    </div>
  </div>
</div>

<script>
  // Clock update
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const t = h+':'+m;
    document.getElementById('clock-time').textContent = t;
    document.getElementById('sb-time').textContent = t;
    const days=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
    const months=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    document.getElementById('clock-date').textContent = days[now.getDay()]+', '+now.getDate()+' '+months[now.getMonth()]+' '+now.getFullYear();
  }
  updateClock(); setInterval(updateClock, 10000);

  let currentUrl = '';
  function openApp(name, url, icon) {
    currentUrl = url;
    document.getElementById('p-icon').textContent = icon;
    document.getElementById('p-title').textContent = name;
    document.getElementById('p-url').textContent = url.replace('https://','').replace('http://','').split('/')[0];
    document.getElementById('p-frame').src = url;
    document.getElementById('popup').classList.add('show');
  }
  function closePopup() {
    document.getElementById('popup').classList.remove('show');
    document.getElementById('p-frame').src = 'about:blank';
  }
  function openExternal() {
    window.open(currentUrl, '_blank');
    closePopup();
  }

  // Tap animation
  document.querySelectorAll('.app-item, .dock-item').forEach(el => {
    el.addEventListener('click', function() {
      const icon = this.querySelector('.app-icon,.folder-box,.dock-icon');
      if(icon){ icon.style.transform='scale(0.82)'; setTimeout(()=>icon.style.transform='',150); }
    });
  });
</script>
</body>
</html>
