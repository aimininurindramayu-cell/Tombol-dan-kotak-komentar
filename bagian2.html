<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indramayu Club Portal - Admin Dulkohar</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #0a0f1e; 
            color: white; 
            text-align: center; 
            padding: 20px; 
        }
        .grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            max-width: 400px; 
            margin: auto; 
        }
        .card { 
            background: #16213e; 
            padding: 20px; 
            border-radius: 15px; 
            border: 1px solid #4ecca3; 
            cursor: pointer; 
            transition: 0.3s;
        }
        .card:active { 
            background: #4ecca3; 
            color: black; 
        }
        h1 { 
            color: #4ecca3; 
            text-shadow: 0 0 10px #4ecca3; 
        }
        input { 
            width: 90%; 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 5px; 
            border: none; 
        }
        .menu-list { 
            list-style: none; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
        }
        .menu-list li { 
            background: rgba(78, 204, 163, 0.1); 
            padding: 10px; 
            border-radius: 5px; 
            cursor: pointer; 
            transition: 0.3s; 
        }
        .menu-list li:hover { 
            background: #4ecca3; 
            color: black; 
        }
        select {
            width: 100%;
            padding: 8px;
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(168,126,46,0.5);
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        select option {
            background: #16213e;
            color: white;
        }
    </style>
</head>
<body>

    <h1>INDRAMAYU CLUB</h1>
    <p>Pusat Kendali Digital Asset Management</p>

    <!-- Grid Tombol Aksi -->
    <div class="grid">
        <div class="card" onclick="aksi('notif', 'Sinkronisasi Rclone Dimulai')">
            🚀<br>Sync Rclone
        </div>
        <div class="card" onclick="aksi('suara', 'Selamat datang Admin Dulkohar')">
            🎙️<br>Tes Suara (TTS)
        </div>
        <div class="card" onclick="window.location.href='/posts/'">
            📂<br>Laporan Hugo
        </div>
        <div class="card" onclick="aksi('getar', '')">
            📳<br>Cek Getar
        </div>
    </div>

    <!-- Input Member Baru -->
    <br>
    <input type="text" id="db_input" placeholder="Masukkan ID Member Baru...">
    <div class="card" style="max-width:360px; margin:auto;" onclick="simpanData()">
        💾 SIMPAN KE DATABASE
    </div>

    <!-- Menu Dropdown Navigasi Utama -->
    <div style="display:flex; flex-direction:column; gap:4px; margin-top: 20px;">
        <label for="menu-dropdown-main"><strong>Menu Utama:</strong></label>
        <select id="menu-dropdown-main" onchange="navigasiMenu(this.value)">
            <option value="">-- Pilih Menu --</option>
            <option value="https://script.google.com/macros/s/AKfycbx3BAf5c4Yje5OTaJ3ZnEvnvTPfHwOcCuKeH9-c_8zJ/dev?p=administrasi">🏠 Beranda / Administrasi</option>
            <option value="https://script.google.com/macros/s/AKfycbx3BAf5c4Yje5OTaJ3ZnEvnvTPfHwOcCuKeH9-c_8zJ/dev?p=android">🤖 Aplikasi Android</option>
            <option value="https://script.google.com/macros/s/AKfycbx3BAf5c4Yje5OTaJ3ZnEvnvTPfHwOcCuKeH9-c_8zJ/dev?p=kamus">📖 Kamus Dayak Ngaju</option>
            <option value="https://script.google.com/macros/s/AKfycbx3BAf5c4Yje5OTaJ3ZnEvnvTPfHwOcCuKeH9-c_8zJ/dev?p=halaman2">📊 Halaman 2 (Laporan)</option>
        </select>
    </div>

    <hr style="border:none; border-top:1px solid #4ecca3; margin:15px 0;">

    <!-- Menu List -->
    <ul class="menu-list">
        <li onclick="window.location.href='https://script.google.com/macros/s/AKfycbx3BAf5c4Yje5OTaJ3ZnEvnvTPfHwOcCuKeH9-c_8zJ/dev?p=administrasi'">🏠 Beranda</li>
        <li onclick="window.location.href='https://script.google.com/macros/s/AKfycbx3BAf5c4Yje5OTaJ3ZnEvnvTPfHwOcCuKeH9-c_8zJ/dev?p=android'">🤖 Android</li>
        <li onclick="window.location.href='https://script.google.com/macros/s/AKfycbx3BAf5c4Yje5OTaJ3ZnEvnvTPfHwOcCuKeH9-c_8zJ/dev?p=kamus'">📖 Kamus</li>
        <li onclick="window.location.href='https://script.google.com/macros/s/AKfycbx3BAf5c4Yje5OTaJ3ZnEvnvTPfHwOcCuKeH9-c_8zJ/dev?p=halaman2'">📊 Halaman 2</li>
    </ul>

    <!-- Menu Dropdown Sektor -->
    <div style="display:flex; flex-direction:column; gap:4px; margin-top: 20px;">
        <label for="menu-dropdown-sektor"><strong>Pilih Sektor:</strong></label>
        <select id="menu-dropdown-sektor" onchange="pindahSektorOtomatis(this.value)">
            <option value="">-- Pilih Sektor --</option>
            <option value="administrasi">🏠 Sektor Administrasi Utama</option>
            <option value="bagian1">🌟 Dimensi Elite / Bagian 1</option>
            <option value="bagian2">📊 Laporan Aset Digital / Bagian 2</option>
        </select>
    </div>

    <script>
        // Fungsi navigasi menu utama
        function navigasiMenu(url) {
            if (url) {
                window.location.href = url;
            }
        }

        // Fungsi navigasi antar sektor
        function pindahSektorOtomatis(namaHalaman) {
            if (!namaHalaman) return;
            
            const urlSistem = window.location.href.split('?')[0];
            window.location.href = urlSistem + "?p=" + namaHalaman;
        }

        // Inisialisasi dropdown saat halaman dimuat
        document.addEventListener("DOMContentLoaded", function() {
            try {
                const params = new URLSearchParams(window.location.search);
                const halamanAktif = params.get('p') || 'administrasi';
                
                const dropdownSektor = document.getElementById('menu-dropdown-sektor');
                if (dropdownSektor) {
                    dropdownSektor.value = halamanAktif;
                }
            } catch (e) {
                console.error('Error inisialisasi:', e.message);
            }
        });

        // Fungsi mengirim aksi ke Flask API
        function aksi(tipe, pesan) {
            try {
                fetch('http://localhost:5000/' + tipe, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: 'msg=' + encodeURIComponent(pesan)
                })
                .then(res => {
                    if (res.ok) {
                        console.log('✓ Aksi dikirim: ' + tipe);
                    } else {
                        console.warn('⚠ Response: ' + res.status);
                    }
                })
                .catch(err => {
                    console.error('✗ Error fetch:', err.message);
                });
            } catch (e) {
                console.error('Error aksi:', e.message);
            }
        }

        // Fungsi simpan data ke database
        function simpanData() {
            try {
                const val = document.getElementById('db_input').value;
                
                if (!val || val.trim() === '') {
                    alert('⚠ Masukkan ID Member terlebih dahulu!');
                    return;
                }
                
                alert('✓ Data "' + val + '" akan dikirim ke 03_ADM_KEUANGAN');
                aksi('notif', 'Data Member Baru Tersimpan: ' + val);
                
                document.getElementById('db_input').value = '';
            } catch (e) {
                console.error('Error simpanData:', e.message);
            }
        }
    </script>
</body>
</html>
